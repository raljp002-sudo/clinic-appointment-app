<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 960" width="360" height="960" style="background:#F8FAFD; font-family:'Roboto', 'Google Sans', -apple-system, sans-serif;">
  <defs>
    <filter id="m-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F1F1F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Mobile Top Bar -->
  <rect x="0" y="0" width="360" height="56" fill="#FFFFFF" />
  <line x1="0" y1="56" x2="360" y2="56" stroke="#E0E3E7" stroke-width="1" />
  <g transform="translate(16, 12)">
    <rect width="32" height="32" rx="6" fill="#E8F0FE" />
    <path d="M16 9 V23 M9 16 H23" stroke="#1A73E8" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="56" y="33" fill="#1F1F1F" font-size="16" font-weight="600">CityHealth Clinic</text>

  <!-- Mobile Card Container -->
  <g transform="translate(16, 72)" filter="url(#m-shadow)">
    <rect width="328" height="860" rx="16" fill="#FFFFFF" stroke="#E0E3E7" stroke-width="1" />

    <text x="16" y="32" fill="#1F1F1F" font-size="18" font-weight="600">Book Appointment</text>
    <text x="16" y="52" fill="#5F6368" font-size="12">Schedule your doctor's visit</text>

    <!-- Field 1: Full Name -->
    <g transform="translate(16, 70)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Full Name *</text>
      <rect x="0" y="8" width="296" height="42" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="34" fill="#9AA0A6" font-size="13">e.g., Maria Santos</text>
    </g>

    <!-- Field 2: Email Address -->
    <g transform="translate(16, 136)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Email Address *</text>
      <rect x="0" y="8" width="296" height="42" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="34" fill="#9AA0A6" font-size="13">name@example.com</text>
    </g>

    <!-- Field 3: Phone Number -->
    <g transform="translate(16, 202)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Phone Number *</text>
      <rect x="0" y="8" width="296" height="42" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="34" fill="#9AA0A6" font-size="13">0917-123-4567</text>
    </g>

    <!-- Field 4: Clinic Department -->
    <g transform="translate(16, 268)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Clinic Department *</text>
      <rect x="0" y="8" width="296" height="42" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="34" fill="#1F1F1F" font-size="13">General Medicine</text>
      <path d="M276 26 L282 32 L288 26" fill="none" stroke="#5F6368" stroke-width="1.8" />
    </g>

    <!-- Field 5: Date Picker -->
    <g transform="translate(16, 334)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Preferred Date *</text>
      <rect x="0" y="8" width="296" height="42" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="34" fill="#1F1F1F" font-size="13">2026-11-20</text>
    </g>

    <!-- Field 6: Radio Slots -->
    <g transform="translate(16, 400)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Preferred Time Slot *</text>
      <g transform="translate(0, 10)">
        <circle cx="10" cy="12" r="7" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.8" />
        <circle cx="10" cy="12" r="3.5" fill="#1A73E8" />
        <text x="24" y="16" fill="#1F1F1F" font-size="12">Morning (9am - 12pm)</text>
      </g>
      <g transform="translate(0, 34)">
        <circle cx="10" cy="12" r="7" fill="#FFFFFF" stroke="#747775" stroke-width="1.8" />
        <text x="24" y="16" fill="#444746" font-size="12">Afternoon (1pm - 5pm)</text>
      </g>
    </g>

    <!-- Field 7: Symptoms Textarea -->
    <g transform="translate(16, 474)">
      <text x="0" y="0" fill="#444746" font-size="11" font-weight="500">Symptoms / Notes (Optional)</text>
      <rect x="0" y="8" width="296" height="74" rx="6" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="12" y="30" fill="#9AA0A6" font-size="12">Describe symptoms...</text>
      <text x="250" y="96" fill="#747775" font-size="10">0/300</text>
    </g>

    <!-- Field 8: Consent Checkbox -->
    <g transform="translate(16, 592)">
      <rect x="0" y="2" width="16" height="16" rx="3" fill="#1A73E8" />
      <path d="M3 10 L6.5 13.5 L13 5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="14" fill="#1F1F1F" font-size="11">I accept clinic booking policies.</text>
    </g>

    <!-- Submit Button -->
    <g transform="translate(16, 636)">
      <rect width="296" height="44" rx="22" fill="#1A73E8" />
      <text x="148" y="27" fill="#FFFFFF" font-size="14" font-weight="500" text-anchor="middle">Book Appointment</text>
    </g>

    <!-- Mobile Live Status -->
    <g transform="translate(16, 700)">
      <rect width="296" height="34" rx="6" fill="#E8F0FE" />
      <text x="10" y="21" fill="#1A73E8" font-size="11">Validation active as you type</text>
    </g>
  </g>
</svg>
