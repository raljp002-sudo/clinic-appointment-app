<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" style="background:#F8FAFD; font-family:'Roboto', 'Google Sans', -apple-system, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1F1F1F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Google Style Top App Bar -->
  <rect x="0" y="0" width="1280" height="64" fill="#FFFFFF" />
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E0E3E7" stroke-width="1" />
  
  <!-- 2D Visual Element: Clinic Logo / Cross Icon -->
  <g transform="translate(64, 14)">
    <rect width="36" height="36" rx="8" fill="#E8F0FE" />
    <path d="M18 10 V26 M10 18 H26" stroke="#1A73E8" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="112" y="38" fill="#1F1F1F" font-size="20" font-weight="600">CityHealth Clinic</text>
  <text x="1100" y="38" fill="#5F6368" font-size="14">Patient Portal</text>

  <!-- Main Card Container (Pattern 1: Material Card) -->
  <g transform="translate(300, 100)" filter="url(#card-shadow)">
    <rect width="680" height="800" rx="20" fill="#FFFFFF" stroke="#E0E3E7" stroke-width="1" />
    
    <!-- Card Header -->
    <text x="48" y="52" fill="#1F1F1F" font-size="24" font-weight="600">Request an Appointment</text>
    <text x="48" y="78" fill="#5F6368" font-size="14">Fill in your information to schedule a consultation with our medical staff.</text>

    <!-- Field 1: Full Name -->
    <g transform="translate(48, 110)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Full Name *</text>
      <rect x="0" y="10" width="584" height="46" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="38" fill="#9AA0A6" font-size="14">e.g., Maria Santos</text>
    </g>

    <!-- Field 2: Email Address (Two-column row) -->
    <g transform="translate(48, 186)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Email Address *</text>
      <rect x="0" y="10" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="38" fill="#9AA0A6" font-size="14">name@example.com</text>
    </g>

    <!-- Field 3: Phone Number -->
    <g transform="translate(352, 186)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Phone Number *</text>
      <rect x="0" y="10" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="38" fill="#9AA0A6" font-size="14">0917-123-4567</text>
    </g>

    <!-- Field 4: Clinic Department -->
    <g transform="translate(48, 262)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Clinic Department *</text>
      <rect x="0" y="10" width="584" height="46" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="38" fill="#1F1F1F" font-size="14">General Medicine</text>
      <!-- Dropdown arrow -->
      <path d="M550 30 L558 38 L566 30" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Field 5: Appointment Date & Field 6: Preferred Time Slot -->
    <g transform="translate(48, 338)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Preferred Date *</text>
      <rect x="0" y="10" width="280" height="46" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="38" fill="#1F1F1F" font-size="14">2026-11-20</text>
      <path d="M260 26 H246 V40 H260 Z M250 23 V26 M256 23 V26" fill="none" stroke="#5F6368" stroke-width="1.5" />
    </g>

    <!-- Time Slot Radio Buttons -->
    <g transform="translate(352, 338)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Preferred Time Slot *</text>
      <!-- Option Morning -->
      <g transform="translate(0, 16)">
        <circle cx="12" cy="14" r="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2" />
        <circle cx="12" cy="14" r="4.5" fill="#1A73E8" />
        <text x="28" y="18" fill="#1F1F1F" font-size="13">Morning (09:00 AM - 12:00 PM)</text>
      </g>
      <!-- Option Afternoon -->
      <g transform="translate(0, 42)">
        <circle cx="12" cy="14" r="8" fill="#FFFFFF" stroke="#747775" stroke-width="2" />
        <text x="28" y="18" fill="#444746" font-size="13">Afternoon (01:00 PM - 05:00 PM)</text>
      </g>
    </g>

    <!-- Field 7: Reason for Visit (Text Area) -->
    <g transform="translate(48, 432)">
      <text x="0" y="0" fill="#444746" font-size="13" font-weight="500">Reason for Visit / Symptoms (Optional)</text>
      <rect x="0" y="10" width="584" height="88" rx="8" fill="#FFFFFF" stroke="#747775" stroke-width="1.2" />
      <text x="16" y="36" fill="#9AA0A6" font-size="13">Describe your symptoms or reason for consultation...</text>
      <text x="530" y="114" fill="#747775" font-size="11">0 / 300</text>
    </g>

    <!-- Field 8: Terms Checkbox -->
    <g transform="translate(48, 560)">
      <rect x="0" y="2" width="18" height="18" rx="4" fill="#1A73E8" />
      <path d="M4 11 L7.5 15 L14 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="16" fill="#1F1F1F" font-size="13">I acknowledge the clinic's cancellation and appointment confirmation policies.</text>
    </g>

    <!-- Submit Button (Google Material Pill Button) -->
    <g transform="translate(48, 610)">
      <rect width="584" height="48" rx="24" fill="#1A73E8" />
      <text x="292" y="30" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Confirm &amp; Request Appointment</text>
    </g>

    <!-- Inline Status / Validation Helper Area -->
    <g transform="translate(48, 680)">
      <rect width="584" height="40" rx="8" fill="#E8F0FE" />
      <text x="16" y="25" fill="#1A73E8" font-size="12">Ready to submit. All mandatory fields (*) will be verified instantly.</text>
    </g>
  </g>
</svg>
