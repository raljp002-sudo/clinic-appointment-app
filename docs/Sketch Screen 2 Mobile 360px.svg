<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 880" width="360" height="880" style="background:#F0F4F9; font-family:'Roboto', 'Google Sans', -apple-system, sans-serif;">
  <defs>
    <filter id="m-conf-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F1F1F" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Mobile Top Bar -->
  <rect x="0" y="0" width="360" height="56" fill="#FFFFFF" />
  <line x1="0" y1="56" x2="360" y2="56" stroke="#DADCE0" stroke-width="1" />
  <g transform="translate(16, 12)">
    <rect width="32" height="32" rx="6" fill="#E8F0FE" />
    <path d="M16 7 V25 M7 16 H25" stroke="#1A73E8" stroke-width="3" stroke-linecap="round" />
    <circle cx="16" cy="16" r="2.5" fill="#188038" />
  </g>
  <text x="56" y="32" fill="#1F1F1F" font-size="16" font-weight="700">CityHealth Clinic</text>
  <text x="272" y="32" fill="#444746" font-size="12" font-weight="500">Portal</text>

  <!-- Mobile Confirmation Card -->
  <g transform="translate(16, 72)" filter="url(#m-conf-shadow)">
    <rect width="328" height="780" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1" />

    <!-- Success Badge -->
    <g transform="translate(136, 26)">
      <circle cx="28" cy="28" r="28" fill="#E6F4EA" />
      <circle cx="28" cy="28" r="19" fill="#188038" />
      <path d="M19 28 L25 34 L37 21" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Heading & Subtitle -->
    <text x="164" y="104" fill="#1F1F1F" font-size="18" font-weight="700" text-anchor="middle">Appointment Confirmed!</text>
    <text x="164" y="124" fill="#444746" font-size="11" text-anchor="middle">Arrive 15 mins before your slot.</text>

    <!-- Reference Pill -->
    <g transform="translate(64, 140)">
      <rect width="200" height="28" rx="14" fill="#E8F0FE" />
      <text x="100" y="19" fill="#041E49" font-size="12" font-weight="500" text-anchor="middle">
        Ref: <tspan font-weight="700">#APT-2026-8841</tspan>
      </text>
    </g>

    <!-- Mobile Summary Details Box -->
    <g transform="translate(16, 184)">
      <rect width="296" height="420" rx="10" fill="#F8FAFD" stroke="#DADCE0" stroke-width="1" />
      
      <!-- Patient -->
      <g transform="translate(14, 24)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">PATIENT NAME</text>
        <text x="0" y="18" fill="#1F1F1F" font-size="14" font-weight="600">Maria Santos</text>
      </g>

      <line x1="14" y1="52" x2="282" y2="52" stroke="#DADCE0" stroke-width="1" />

      <!-- Department -->
      <g transform="translate(14, 74)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">CLINIC DEPARTMENT</text>
        <text x="0" y="18" fill="#1F1F1F" font-size="13" font-weight="600">General Medicine &amp; Primary Care</text>
      </g>

      <line x1="14" y1="104" x2="282" y2="104" stroke="#DADCE0" stroke-width="1" />

      <!-- Date & Time -->
      <g transform="translate(14, 126)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">APPOINTMENT DATE</text>
        <text x="0" y="18" fill="#1F1F1F" font-size="13" font-weight="600">Friday, Nov 20, 2026</text>
        <text x="0" y="34" fill="#444746" font-size="12">Morning (09:00 AM - 12:00 PM)</text>
      </g>

      <line x1="14" y1="172" x2="282" y2="172" stroke="#DADCE0" stroke-width="1" />

      <!-- Contact -->
      <g transform="translate(14, 194)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">CONTACT DETAILS</text>
        <text x="0" y="18" fill="#1F1F1F" font-size="12">name@example.com</text>
        <text x="0" y="34" fill="#1F1F1F" font-size="12">09171234567</text>
      </g>

      <line x1="14" y1="240" x2="282" y2="240" stroke="#DADCE0" stroke-width="1" />

      <!-- Status Indicator -->
      <g transform="translate(14, 262)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">BOOKING STATUS</text>
        <g transform="translate(0, 10)">
          <circle cx="5" cy="5" r="4.5" fill="#188038" />
          <text x="16" y="9" fill="#188038" font-size="12" font-weight="600">Confirmed &amp; Queued</text>
        </g>
      </g>

      <line x1="14" y1="296" x2="282" y2="296" stroke="#DADCE0" stroke-width="1" />

      <!-- Notes / Reason -->
      <g transform="translate(14, 318)">
        <text x="0" y="0" fill="#747775" font-size="10" font-weight="600">PATIENT NOTES / REASON</text>
        <rect x="0" y="8" width="268" height="38" rx="4" fill="#FFFFFF" stroke="#E0E3E7" stroke-width="1" />
        <text x="8" y="28" fill="#444746" font-size="11">Routine check-up</text>
      </g>
    </g>

    <!-- Mobile Stacked Action Buttons -->
    <g transform="translate(16, 624)">
      <!-- Primary Save/Print -->
      <rect x="0" y="0" width="296" height="44" rx="22" fill="#1A73E8" />
      <text x="148" y="27" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Print / Save Summary</text>

      <!-- Secondary Book Another -->
      <rect x="0" y="54" width="296" height="44" rx="22" fill="#FFFFFF" stroke="#747775" stroke-width="1" />
      <text x="148" y="81" fill="#1A73E8" font-size="14" font-weight="600" text-anchor="middle">&#8592; Book Another Appointment</text>
    </g>
  </g>
</svg>
